<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to your Recipe Planner account.">
  <title>Recipe Planner | Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-[url('recipie.jpg')] bg-cover bg-center bg-no-repeat font-['Poppins'] text-[#3D2C29]">
  <main class="flex min-h-screen flex-col items-center justify-center gap-10 bg-black/10 px-6 py-10 md:flex-row md:justify-between md:px-12 lg:px-20">
    <div class="flex w-full max-w-xl flex-col font-['Playfair_Display'] text-6xl leading-none drop-shadow-sm sm:text-7xl lg:text-[90px]">
      <span>Recipe</span>
      <span class="self-end">Planner</span>
    </div>

    <section class="w-full max-w-sm shrink-0 rounded-2xl bg-[#FFF8F0] p-6 shadow-xl shadow-black/20" aria-labelledby="login-heading">
      <h1 id="login-heading" class="mb-4 text-center font-['Playfair_Display'] text-4xl">
        Login
      </h1>

      <form id="login-form" class="flex flex-col gap-4">
        <div class="flex flex-col gap-1">
          <label for="email" class="text-lg">Email:</label>
          <input
            id="email"
            name="email"
            type="email"
            required
            autocomplete="username"
            placeholder="Enter your email"
            class="w-full rounded-lg bg-gray-200 px-3 py-2 placeholder:text-[#7A675C] focus:outline-none focus:ring-2 focus:ring-[#4F7F58]"
          >
        </div>

        <div class="flex flex-col gap-1">
          <label for="password" class="text-lg">Password:</label>
          <input
            id="password"
            name="password"
            type="password"
            required
            autocomplete="current-password"
            placeholder="Enter your password"
            class="w-full rounded-lg bg-gray-200 px-3 py-2 placeholder:text-[#7A675C] focus:outline-none focus:ring-2 focus:ring-[#4F7F58]"
          >
        </div>

        <p
          id="error-message"
          class="hidden rounded-lg bg-red-100 px-3 py-2 text-sm font-medium text-red-700"
          role="alert"
          aria-live="polite"
        ></p>

        <button
          type="submit"
          class="mt-2 cursor-pointer self-center rounded-full bg-[#E07A5F] px-8 py-2 text-lg font-medium transition hover:bg-[#C9654B] focus:outline-none focus:ring-2 focus:ring-[#4F7F58] focus:ring-offset-2 active:scale-95"
        >
          Login
        </button>
      </form>

      <section id="dashboard" class="text-center" aria-live="polite" hidden>
        <div class="mb-3 text-5xl" aria-hidden="true">👋</div>
        <h2 id="welcome-message" class="font-['Playfair_Display'] text-3xl">
          Welcome!
        </h2>
        <p class="mt-3 text-sm leading-6 text-[#7A675C]">
          You have successfully signed in to Recipe Planner.
        </p>
        <button
          id="logout-button"
          type="button"
          class="mt-5 cursor-pointer rounded-full border-2 border-[#4F7F58] px-7 py-2 font-medium transition hover:bg-[#4F7F58] hover:text-white focus:outline-none focus:ring-2 focus:ring-[#4F7F58] focus:ring-offset-2 active:scale-95"
        >
          Log Out
        </button>
      </section>

      <div id="demo-account" class="mt-6 border-t border-[#DCCFC3] pt-4 text-center text-xs text-[#7A675C]">
        <p class="font-semibold uppercase tracking-wider">Demo account</p>
        <p class="mt-1">alex@example.com / recipe123</p>
      </div>
    </section>
  </main>

  <script>
    "use strict";

    const users = [
      {
        email: "alex@example.com",
        password: "recipe123",
        name: "Alex"
      },
      {
        email: "maya@example.com",
        password: "meal456",
        name: "Maya"
      },
      {
        email: "sam@example.com",
        password: "food789",
        name: "Sam"
      }
    ];

    const loginForm = document.getElementById("login-form");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const errorMessage = document.getElementById("error-message");
    const dashboard = document.getElementById("dashboard");
    const welcomeMessage = document.getElementById("welcome-message");
    const logoutButton = document.getElementById("logout-button");
    const demoAccount = document.getElementById("demo-account");

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.classList.toggle("hidden", !message);
    }

    loginForm.addEventListener("submit", function (event) {
      event.preventDefault();

      const email = emailInput.value.trim().toLowerCase();
      const password = passwordInput.value;

      const matchedUser = users.find(function (user) {
        return user.email === email && user.password === password;
      });

      if (matchedUser) {
        showError("");
        welcomeMessage.textContent = "Welcome, " + matchedUser.name + "!";
        loginForm.hidden = true;
        demoAccount.hidden = true;
        dashboard.hidden = false;
        logoutButton.focus();
        return;
      }

      showError("Incorrect email or password. Please try again.");
      passwordInput.value = "";
      passwordInput.focus();
    });

    logoutButton.addEventListener("click", function () {
      dashboard.hidden = true;
      loginForm.hidden = false;
      demoAccount.hidden = false;
      loginForm.reset();
      showError("");
      emailInput.focus();
    });
  </script>
</body>
</html>
