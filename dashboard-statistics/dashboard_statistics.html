<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe-Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <!-- Dashboard Statistics -->
<section class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3 mb-8">

    <!-- Average Preparation Time -->
    <div class="bg-white rounded-xl shadow p-6">
        <h3 class="text-gray-500 text-sm font-medium">
            Average Prep Time
        </h3>

        <p class="text-3xl font-bold text-gray-800 mt-2">
            <span id="average-prep-time">0</span>
            <span class="text-lg font-normal">min</span>
        </p>
    </div>

    <!-- Total Calories -->
    <div class="bg-white rounded-xl shadow p-6">
        <h3 class="text-gray-500 text-sm font-medium">
            Total Calories
        </h3>

        <p id="total-calories"
           class="text-3xl font-bold text-gray-800 mt-2">
            0
        </p>
    </div>

    <!-- Vegetarian Recipes -->
    <div class="bg-white rounded-xl shadow p-6">
        <h3 class="text-gray-500 text-sm font-medium">
            Vegetarian Recipes
        </h3>

        <p id="vegetarian-count"
           class="text-3xl font-bold text-gray-800 mt-2">
            0
        </p>

    </div>

    <!-- JAVASCRIPT PART -->
    <script>
        const recipes = [
        {
            name: "Jollof Rice",
            prepTime: 30,
            calories: 450,
            isVegetarian: false
        },
        {
            name: "Veggie Stir Fry",
            prepTime: 20,
            calories: 300,
            isVegetarian: true
        },
        {
            name: "Fruit Salad",
            prepTime: 10,
            calories: 150,
            isVegetarian: true
        }
    ];

        function updateStatistics(recipes) {

            // step1: calculate all three totals using reduce
            const totals = recipes.reduce(function(accumulator, recipe) {
                // Add preparation time
                accumulator.totalPrepTime = accumulator.totalPrepTime + accumulator.prepTime;

                // Add calories
                accumulator.totalCalories = accumulator.totalCalories + accumulator.calories;

                // count vegetarian recipes
                if (recipe.isVegetarian === true) {
                    accumulator.vegetarianCount = accumulator.vegetarianCount + 1;
                }

                return accumulator

            }, {
                totalPrepTime: 0,
                totalCalories: 0,
                vegetarianCount: 0
            });
        
        // step 2: calculate average safely

        if (recipes.length > 0) {
            averagePrepTime = totals.totalPrepTime / recipes.length;
        }   
        
        // step 3: display the results in html
        document.getElementById("average-prep-time").textContent =
            averagePrepTime.toFixed(1);

        document.getElementById("total-calories").textContent =
            totals.totalCalories.toLocaleString();

        document.getElementById("vegetarian-count").textContent =
            totals.vegetarianCount;
        }


        


        
    </script>

</section>
</body>
</html>
